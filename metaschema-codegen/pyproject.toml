[project]
name = "metaschema-codegen"
version = "0.1.0"
description = "A Python Library for parsing metaschema definitions and creating corresponding python classes"
authors = [{name = "Robert Sherwood", email = "robert.sherwood@credentive.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "lxml",
    "xmlschema",
    "jinja2",
    "regex",
]

[dependency-groups]
dev = [
    "mypy",
    "black",
    "flake8",
    "pylint",
    "types-lxml",
    "pytest",
    "ruff>=0.11.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
]
